name: Build ZARA Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: zara-app/package-lock.json

      - name: Install dependencies
        working-directory: zara-app
        run: npm install --no-audit --no-fund

      - name: Package Windows installer
        working-directory: zara-app
        run: npm run desktop:dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ZARA-AI-Windows-x64
          path: zara-app/release/*.exe
          if-no-files-found: error
          retention-days: 14
